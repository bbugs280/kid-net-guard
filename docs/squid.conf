# kid-net-guard — Squid proxy configuration
# Opt-in HTTP proxy for selective domain filtering.
# Part of the kid-net-guard project (~/Projects/kid-net-guard).
#
# Role: blocks specific services (YouTube/Roblox/Discord/etc) at the
# CONNECTION level while allowing everything else.
#
# NOTE: this is an OPT-IN proxy — only traffic from devices explicitly
# configured to use it (Wi-Fi -> Proxy -> Manual -> 192.168.86.20:3128)
# passes through here. See docs/proxy.md for the full architecture.
#
# The `blocked_sites` ACL (auto-managed section) is owned and rewritten by the
# bridge daemon (scripts/squid_bridge.py) — do NOT hand-edit that section;
# control it via the kid-net-guard console instead.

# ── Network / listening ────────────────────────────────
http_port 192.168.86.20:3128

# ── Access control lists ───────────────────────────────
# LAN sources allowed to use this proxy
acl localnet src 192.168.86.0/24

# >>> kid-net-guard blocked services (auto-managed) >>>
acl blocked_sites dstdomain .kidnet.invalid
# <<< kid-net-guard blocked services (auto-managed) <<<

# ── Ports ──────────────────────────────────────────────
acl SSL_ports port 443
acl Safe_ports port 80      # http
acl Safe_ports port 21      # ftp
acl Safe_ports port 443     # https
acl Safe_ports port 70      # gopher
acl Safe_ports port 210     # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280     # http-mgmt
acl Safe_ports port 488     # gss-http
acl Safe_ports port 591     # filemaker
acl Safe_ports port 777     # multiling http

# ── Access rules (first match wins) ────────────────────
# Deny requests to unsafe ports
http_access deny !Safe_ports

# Deny CONNECT to non-SSL ports
http_access deny CONNECT !SSL_ports

# DENY the blocked sites (checked BEFORE the allow below)
http_access deny blocked_sites

# Allow cachemgr only from localhost
http_access allow localhost manager
http_access deny manager

# Protect local services / link-local addresses
http_access deny to_localhost
http_access deny to_linklocal

# Allow LAN clients
http_access allow localnet

# Allow localhost (for testing from the Mac Mini itself)
http_access allow localhost

# Default deny
http_access deny all

# ── Cache ──────────────────────────────────────────────
# Disable caching entirely — we filter, we don't accelerate.
cache deny all

# ── Logs ───────────────────────────────────────────────
access_log /opt/homebrew/var/logs/squid/access.log squid
cache_log  /opt/homebrew/var/logs/squid/cache.log
cache_store_log none

# ── Misc ───────────────────────────────────────────────
coredump_dir /opt/homebrew/var/cache/squid
refresh_pattern ^ftp:      1440    20%     10080
refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
refresh_pattern .          0       20%     4320

# Hostname / admin metadata
visible_hostname kidnet-proxy
